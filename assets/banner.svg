<svg width="100%" height="250" viewBox="0 0 1000 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#090e1e" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- Rainbow Neon Ring Gradient -->
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="25%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="75%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Metallic Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F0F9FF" />
      <stop offset="75%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Circuit Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="20%" stop-color="#00F2FE" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#8B5CF6" stop-opacity="1" />
      <stop offset="60%" stop-color="#EC4899" stop-opacity="1" />
      <stop offset="80%" stop-color="#10B981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="cblur" />
      <feMerge>
        <feMergeNode in="cblur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.06); }
    }
    @keyframes sweepLine {
      0% { transform: translateX(-400px); }
      100% { transform: translateX(1100px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    @keyframes spinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(0.96); opacity: 0.85; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    @keyframes orbitPulse {
      0%, 100% { filter: drop-shadow(0 0 2px #00F2FE); }
      50% { filter: drop-shadow(0 0 8px #EC4899); }
    }
    .hud-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 42px;
      letter-spacing: 5px;
      fill: url(#textGrad);
    }
    .hud-sub {
      font-family: 'Fira Code', 'SF Mono', Consolas, monospace;
      font-size: 13px;
      letter-spacing: 2.5px;
      font-weight: 700;
      fill: #38BDF8;
    }
    .hud-tag {
      font-family: 'Fira Code', 'SF Mono', Consolas, monospace;
      font-size: 10.5px;
      fill: #94A3B8;
      letter-spacing: 1.5px;
    }
    .hud-status {
      font-family: 'Fira Code', monospace;
      font-size: 10px;
      font-weight: 700;
      fill: #10B981;
      letter-spacing: 1px;
    }
    .glow-pulse {
      animation: pulseGlow 4s ease-in-out infinite;
      transform-origin: center;
    }
    .blink-dot {
      animation: blink 2s ease-in-out infinite;
    }
    .grid-path {
      stroke: #1E293B;
      stroke-width: 0.8;
      stroke-opacity: 0.45;
    }
    .corner-bracket {
      stroke: #00F2FE;
      stroke-width: 2.2;
      fill: none;
    }
    .scanner-beam {
      animation: sweepLine 6s ease-in-out infinite;
    }
    .anim-spin-cw {
      animation: spinClockwise 16s linear infinite;
      transform-origin: 840px 105px;
    }
    .anim-spin-ccw {
      animation: spinCounter 10s linear infinite;
      transform-origin: 840px 105px;
    }
    .anim-breathe {
      animation: breathe 3.5s ease-in-out infinite;
      transform-origin: 840px 105px;
    }
    .tech-badge-glow {
      animation: orbitPulse 3s ease-in-out infinite;
    }
  </style>

  <!-- Container Base with Cyber Border -->
  <rect x="2" y="2" width="996" height="246" rx="14" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="1.5" />

  <!-- Background Cyber Isometric Grid -->
  <g class="grid-path">
    <!-- Horizontal Scanlines -->
    <line x1="20" y1="35" x2="980" y2="35" />
    <line x1="20" y1="75" x2="980" y2="75" />
    <line x1="20" y1="115" x2="980" y2="115" />
    <line x1="20" y1="155" x2="980" y2="155" />
    <line x1="20" y1="195" x2="980" y2="195" />

    <!-- Vertical Circuit Lines -->
    <line x1="60" y1="20" x2="60" y2="230" />
    <line x1="220" y1="20" x2="220" y2="230" />
    <line x1="500" y1="20" x2="500" y2="230" />
    <line x1="710" y1="20" x2="710" y2="230" />
    <line x1="940" y1="20" x2="940" y2="230" />
  </g>

  <!-- Animated Scanner Beam -->
  <g class="scanner-beam">
    <line x1="0" y1="20" x2="0" y2="230" stroke="#00F2FE" stroke-width="1.5" opacity="0.6" filter="url(#neonBlur)" />
  </g>

  <!-- Ambient Hologram Glows -->
  <circle cx="260" cy="50" r="140" fill="#00F2FE" opacity="0.08" filter="url(#neonBlur)" class="glow-pulse" />
  <circle cx="840" cy="105" r="140" fill="#9333EA" opacity="0.14" filter="url(#neonBlur)" class="glow-pulse" />
  <circle cx="840" cy="105" r="80" fill="#00F2FE" opacity="0.12" filter="url(#neonBlur)" class="glow-pulse" />

  <!-- High-Tech Corner Brackets -->
  <path d="M 16 34 L 16 16 L 34 16" class="corner-bracket" />
  <path d="M 984 34 L 984 16 L 966 16" class="corner-bracket" />
  <path d="M 16 216 L 16 234 L 34 234" class="corner-bracket" />
  <path d="M 984 216 L 984 234 L 966 234" class="corner-bracket" />

  <!-- Top HUD Status Telemetry Header -->
  <g transform="translate(40, 24)">
    <circle cx="6" cy="6" r="4.5" fill="#10B981" class="blink-dot" />
    <circle cx="6" cy="6" r="8" stroke="#10B981" stroke-width="1.2" opacity="0.4" />
    <text x="22" y="10" class="hud-status">AZURE &amp; DEVOPS ENVIRONMENT: ONLINE // 17+ YEARS IT EXPERIENCE</text>
    <text x="890" y="10" class="hud-tag" text-anchor="end">SYS.VER 3.4.0</text>
  </g>

  <!-- Main Hero Title & Identity -->
  <g transform="translate(50, 94)">
    <text x="0" y="0" class="hud-title">SUJEET KUMAR</text>
    <text x="2" y="32" class="hud-sub">SENIOR AZURE &amp; DEVOPS ENGINEER (17+ YRS EXP)</text>
    <text x="2" y="58" class="hud-tag">MICROSOFT AZURE &#8226; TERRAFORM (IaC) &#8226; AZURE DEVOPS (ADO) &#8226; GIT &amp; CI/CD</text>
  </g>

  <!-- ======================================================== -->
  <!-- ULTRA-COLORFUL ANIMATED DEVSECOPS LOGO WITH TECH ICONS   -->
  <!-- ======================================================== -->
  <g>
    <!-- Outer Rainbow Circuit Ring (Clockwise) -->
    <circle cx="840" cy="105" r="68" stroke="url(#rainbowGrad)" stroke-width="2" stroke-dasharray="12 8 24 8" opacity="0.85" class="anim-spin-cw" filter="url(#coreGlow)" />

    <!-- Middle Glowing Gear Ring (Counter-Clockwise) -->
    <circle cx="840" cy="105" r="52" stroke="#00F2FE" stroke-width="1.8" stroke-dasharray="16 12" opacity="0.75" class="anim-spin-ccw" />

    <!-- Connecting Circuit Crossbeams -->
    <g stroke="#38BDF8" stroke-width="1" opacity="0.4">
      <line x1="772" y1="105" x2="908" y2="105" stroke-dasharray="4 4" />
      <line x1="840" y1="37" x2="840" y2="173" stroke-dasharray="4 4" />
    </g>

    <!-- Central Glowing Core Base -->
    <circle cx="840" cy="105" r="34" fill="#0B132B" stroke="url(#rainbowGrad)" stroke-width="2.2" class="anim-breathe" filter="url(#coreGlow)" />
    <circle cx="840" cy="105" r="22" fill="#030712" stroke="#8B5CF6" stroke-width="1.5" />

    <!-- Central DevSecOps Glowing Shield & Lock Symbol -->
    <g transform="translate(827, 92)" class="tech-badge-glow">
      <path d="M13 2 L24 6 V15 C24 21 13 26 13 26 C13 26 2 21 2 15 V6 Z" fill="#020617" stroke="#00F2FE" stroke-width="2" />
      <path d="M9 12 V9 C9 7 10.5 5.5 13 5.5 C15.5 5.5 17 7 17 9 V12" stroke="#10B981" stroke-width="1.8" fill="none" />
      <rect x="7.5" y="12" width="11" height="9" rx="2" fill="#EC4899" stroke="#F43F5E" stroke-width="1" />
      <circle cx="13" cy="15.5" r="1.3" fill="#FFFFFF" />
      <line x1="13" y1="16.5" x2="13" y2="18.5" stroke="#FFFFFF" stroke-width="1" />
    </g>

    <!-- 4 ORBITING TECH LOGOS (Azure, Kubernetes, Terraform, Docker) -->
    <!-- 1. TOP: AZURE -->
    <g transform="translate(840, 40)" class="tech-badge-glow">
      <circle cx="0" cy="0" r="15" fill="#081b33" stroke="#0089D6" stroke-width="1.5" />
      <g transform="translate(-7, -7) scale(0.6)">
        <path d="M4 19L11 3L15 9L8 19H4Z" fill="#0089D6" />
        <path d="M11 12L15 9L20 19H8L11 12Z" fill="#0072C6" />
      </g>
    </g>

    <!-- 2. RIGHT: KUBERNETES -->
    <g transform="translate(905, 105)" class="tech-badge-glow">
      <circle cx="0" cy="0" r="15" fill="#0a1a38" stroke="#326CE5" stroke-width="1.5" />
      <g transform="translate(-7, -7) scale(0.6)">
        <circle cx="12" cy="12" r="8" stroke="#326CE5" stroke-width="2" fill="none"/>
        <circle cx="12" cy="12" r="2.5" fill="#38BDF8"/>
        <line x1="12" y1="4" x2="12" y2="8" stroke="#326CE5" stroke-width="2"/>
        <line x1="12" y1="16" x2="12" y2="20" stroke="#326CE5" stroke-width="2"/>
        <line x1="5" y1="8" x2="9" y2="10" stroke="#326CE5" stroke-width="2"/>
        <line x1="15" y1="14" x2="19" y2="16" stroke="#326CE5" stroke-width="2"/>
        <line x1="5" y1="16" x2="9" y2="14" stroke="#326CE5" stroke-width="2"/>
        <line x1="15" y1="10" x2="19" y2="8" stroke="#326CE5" stroke-width="2"/>
      </g>
    </g>

    <!-- 3. BOTTOM: TERRAFORM -->
    <g transform="translate(840, 170)" class="tech-badge-glow">
      <circle cx="0" cy="0" r="15" fill="#1b1233" stroke="#844FBA" stroke-width="1.5" />
      <g transform="translate(-7, -7) scale(0.6)">
        <polygon points="2,2 7,5 7,11 2,8" fill="#5C4EE5"/>
        <polygon points="8,5.5 13,8.5 13,14.5 8,11.5" fill="#844FBA"/>
        <polygon points="8,12 13,15 13,21 8,18" fill="#5C4EE5"/>
        <polygon points="14,8.5 19,11.5 19,17.5 14,14.5" fill="#844FBA"/>
      </g>
    </g>

    <!-- 4. LEFT: DOCKER -->
    <g transform="translate(775, 105)" class="tech-badge-glow">
      <circle cx="0" cy="0" r="15" fill="#082238" stroke="#2496ED" stroke-width="1.5" />
      <g transform="translate(-8, -6) scale(0.7)">
        <rect x="3" y="4" width="2.5" height="2.5" fill="#2496ED" rx="0.3"/>
        <rect x="6.5" y="4" width="2.5" height="2.5" fill="#2496ED" rx="0.3"/>
        <rect x="6.5" y="0.5" width="2.5" height="2.5" fill="#2496ED" rx="0.3"/>
        <rect x="10" y="4" width="2.5" height="2.5" fill="#2496ED" rx="0.3"/>
        <rect x="10" y="0.5" width="2.5" height="2.5" fill="#2496ED" rx="0.3"/>
        <path d="M18 7C17.5 5.8 16.2 5.5 15.5 5.5C15 5.5 14.2 5.8 13.8 6.3C12.5 6.2 7 6.3 3.5 9C2 10.2 2 11.5 2 11.5C3.5 12.3 7 12.3 10.5 12.3C14.5 12.3 17 10.8 18 8.3C18.5 8.3 19 8 18 7Z" fill="#2496ED"/>
      </g>
    </g>
  </g>

  <!-- Neon Glowing Separator Circuit -->
  <line x1="40" y1="176" x2="960" y2="176" stroke="url(#lineGrad)" stroke-width="2" filter="url(#neonBlur)" />

  <!-- Bottom Metric Telemetry Pills -->
  <g transform="translate(48, 196)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="190" height="28" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1" />
    <circle cx="14" cy="14" r="3.5" fill="#38BDF8" />
    <text x="26" y="18" font-family="'Fira Code', monospace" font-size="10.5" fill="#E2E8F0" font-weight="600">17+ YRS IT EXPERIENCE</text>

    <!-- Pill 2 -->
    <rect x="206" y="0" width="190" height="28" rx="6" fill="#0F172A" stroke="#7C3AED" stroke-width="1" />
    <circle cx="220" cy="14" r="3.5" fill="#A78BFA" />
    <text x="232" y="18" font-family="'Fira Code', monospace" font-size="10.5" fill="#E2E8F0" font-weight="600">AZURE CLOUD INFRA</text>

    <!-- Pill 3 -->
    <rect x="412" y="0" width="190" height="28" rx="6" fill="#0F172A" stroke="#059669" stroke-width="1" />
    <circle cx="426" cy="14" r="3.5" fill="#34D399" />
    <text x="438" y="18" font-family="'Fira Code', monospace" font-size="10.5" fill="#E2E8F0" font-weight="600">TERRAFORM MODULES</text>

    <!-- Pill 4 -->
    <rect x="618" y="0" width="190" height="28" rx="6" fill="#0F172A" stroke="#D97706" stroke-width="1" />
    <circle cx="632" cy="14" r="3.5" fill="#FBBF24" />
    <text x="644" y="18" font-family="'Fira Code', monospace" font-size="10.5" fill="#E2E8F0" font-weight="600">ADO YAML PIPELINES</text>

    <!-- Pill 5 -->
    <rect x="824" y="0" width="80" height="28" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1" />
    <circle cx="838" cy="14" r="3.5" fill="#10B981" />
    <text x="848" y="18" font-family="'Fira Code', monospace" font-size="10.5" fill="#10B981" font-weight="700">GIT/CI-CD</text>
  </g>
</svg>
